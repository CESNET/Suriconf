%YAML 1.1
---

suriconf-version: 1.0-dev

suri-configuration: suricata.yaml
suricata-bin: /usr/bin/suricata
ethtool-bin: /usr/bin/ethtool
ifconfig-bin: /usr/sbin/ifconfig
ip-bin: /usr/sbin/ip
log-dir: /var/log/suricata/
socket: /var/run/suricata.pid
preconf-time: 360 # in seconds
# 360 is minimum for flow_threads module
analysis: static # static/dynamic 

mode:
  modify:
    enabled: true
    yaml_change: force # ask/force
  suggestion:
    enabled: false

modules:
  - name: cpu_affinity
    enabled: true

  - name: memory_usage
    enabled: true

  - name: flow
    enabled: true

  - name: flow_threads
    enabled: true

variables:
  interface: wlan0
  capture_mode: af_packet # dpdk
  max_memory_usage: 1 GiB
  max_cpu_usage_vec: [0, 1, 2, 3, 4, 5, 6]
