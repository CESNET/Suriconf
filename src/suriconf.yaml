%YAML 1.1
---

suriconf-version: 1.0

suri-configuration: suricata.yaml
suricata-bin: /usr/bin/suricata
log-dir: /var/log/suricata/
preconf-time: 360 # in seconds
analysis: static # static/dynamic 

mode:
  modify:
    enabled: true
    yaml_change: force # ask/force
  suggestion:
    enabled: false

modules:
  - name: test_cpu_affinity
    enabled: false

  - name: memory_usage
    enabled: false

  - name: flow
    enabled: true

  - name: flow_threads
    enabled: true

variables:
  interface: wlan0
  capture_mode: af_packet # dpdk
  max_memory_usage: 1 GiB #there has to be space
  max_cpu_usage_vec: [7, 8, 9, 10, 0, 1, 2, 3, 4, 5, 6 ]
