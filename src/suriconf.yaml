%YAML 1.1
---

suriconf-version: 1.0

suri-configuration: suricata.yaml
suricata-bin: /usr/bin/suricata
log-dir: /var/log/suricata/

mode:
  modify:
    enabled: true
    yaml_change: force # ask/force
  suggestion:
    enabled: false

modules:
  - name: test_cpu_affinity
    enabled: true

  - name: memory_usage
    enabled: false

  - name: set_flow
    enabled: false

variables:
  interface: wlan0
  capture_mode: dpdk
  max_memory_usage: 10 KiB #there has to be space
  max_cpu_usage: 6
