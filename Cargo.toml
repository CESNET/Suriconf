[package]
name = "suriconf"
edition = "2024"
version = "1.0.0-dev"
authors = ["Eliška Červinková <eliska.cervinkova@cesnet.cz>"]
license = "BSD-3-Clause"
description = "A tool for automating Suricata setup and configuration."
readme = "README.md"
homepage = "https://github.com/CESNET/Suriconf"
repository = "https://github.com/CESNET/Suriconf"
keywords = ["cli", "configuration", "suricata", "suriconf"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5.48", features = ["derive", "env"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.9"
is_executable = "1.0.5"
crossbeam-channel = "0.5.15"
anyhow = "1.0.100"
signal-hook = "0.3.18"
chrono = "0.4.42"
serde = { version = "1.0.228", features = ["derive"] }
strum = "0.27.2"
strum_macros = "0.27.2"
byte-unit = "5.2.0"
scirs2-stats = "0.3.0"
scirs2-core = "0.3.0"
sysinfo = "0.38.3"
procfs = "0.18.0"
itertools = "0.14.0"